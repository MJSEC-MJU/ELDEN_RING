# ============================================================
# ELDEN RING - Harness Delegate Deployment
# K8s 클러스터에 Harness Delegate를 배포하여
# Harness 플랫폼과 클러스터 간 통신 브릿지 역할
# ============================================================
# 사전 준비:
#   1. Harness 계정에서 Delegate Token 발급
#   2. HARNESS_ACCOUNT_ID, HARNESS_DELEGATE_TOKEN 환경변수 설정
#   3. kubectl apply -f harness-delegate.yaml
# ============================================================

apiVersion: v1
kind: Secret
metadata:
  name: harness-delegate-token
  namespace: elden-harness
type: Opaque
data:
  # base64 인코딩된 Delegate Token (실제 값으로 교체 필요)
  # echo -n "<YOUR_DELEGATE_TOKEN>" | base64
  DELEGATE_TOKEN: "REPLACE_WITH_BASE64_ENCODED_TOKEN"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harness-delegate
  namespace: elden-harness
  labels:
    app: harness-delegate
    elden-ring/plane: system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: harness-delegate
  template:
    metadata:
      labels:
        app: harness-delegate
        elden-ring/plane: system
    spec:
      serviceAccountName: harness-delegate-sa
      terminationGracePeriodSeconds: 600
      containers:
        - name: delegate
          image: harness/delegate:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: JAVA_OPTS
              value: "-Xms256m -Xmx512m"
            - name: ACCOUNT_ID
              value: "REPLACE_WITH_HARNESS_ACCOUNT_ID"
            - name: DELEGATE_NAME
              value: "elden-ring-delegate"
            - name: DELEGATE_TYPE
              value: "KUBERNETES"
            - name: DEPLOY_MODE
              value: "KUBERNETES"
            - name: DELEGATE_TAGS
              value: "elden-ring,k8s,production"
            - name: MANAGER_HOST_AND_PORT
              value: "https://app.harness.io"
            - name: DELEGATE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: harness-delegate-token
                  key: DELEGATE_TOKEN
            - name: DELEGATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: INIT_SCRIPT
              value: ""
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3460
            initialDelaySeconds: 120
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3460
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: harness-delegate
  namespace: elden-harness
spec:
  selector:
    app: harness-delegate
  ports:
    - port: 8080
      targetPort: 8080
