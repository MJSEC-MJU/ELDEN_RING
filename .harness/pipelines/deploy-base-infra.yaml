# ============================================================
# ELDEN RING - Base Infrastructure Deployment Pipeline
# K8s 기반 인프라 (Namespace, RBAC, NetworkPolicy 등) 배포
# ============================================================
pipeline:
  name: Deploy Base Infrastructure
  identifier: deploy_base_infra
  projectIdentifier: eldenring
  orgIdentifier: default
  tags:
    type: infrastructure
  stages:
    - stage:
        name: Deploy Namespaces and RBAC
        identifier: deploy_ns_rbac
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: eldentargetapp
          environment:
            environmentRef: eldenproduction
            deployToAll: false
            infrastructureDefinitions:
              - identifier: elden_prod_infra
          execution:
            steps:
              - step:
                  name: Apply Namespaces
                  identifier: apply_namespaces
                  type: K8sApply
                  timeout: 5m
                  spec:
                    filePaths:
                      - kubernetes/base/namespaces.yaml
                    skipDryRun: false
                    skipSteadyStateCheck: true
              - step:
                  name: Apply RBAC
                  identifier: apply_rbac
                  type: K8sApply
                  timeout: 5m
                  spec:
                    filePaths:
                      - kubernetes/base/rbac.yaml
                    skipDryRun: false
                    skipSteadyStateCheck: true
              - step:
                  name: Apply Network Policies
                  identifier: apply_netpol
                  type: K8sApply
                  timeout: 5m
                  spec:
                    filePaths:
                      - kubernetes/base/network-policies.yaml
                    skipDryRun: false
                    skipSteadyStateCheck: true
              - step:
                  name: Apply Resource Quotas
                  identifier: apply_quotas
                  type: K8sApply
                  timeout: 5m
                  spec:
                    filePaths:
                      - kubernetes/base/resource-quotas.yaml
                    skipDryRun: false
                    skipSteadyStateCheck: true
            rollbackSteps: []
    - stage:
        name: Deploy Monitoring Stack
        identifier: deploy_monitoring
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: eldentargetapp
          environment:
            environmentRef: eldenproduction
            deployToAll: false
            infrastructureDefinitions:
              - identifier: elden_prod_infra
          execution:
            steps:
              - step:
                  name: Install Prometheus
                  identifier: install_prometheus
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
                          helm repo update
                          helm upgrade --install prometheus prometheus-community/kube-prometheus-stack \
                            --namespace elden-monitoring \
                            --values kubernetes/monitoring/prometheus/values.yaml \
                            --wait --timeout 10m
              - step:
                  name: Install Loki
                  identifier: install_loki
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          helm repo add grafana https://grafana.github.io/helm-charts
                          helm repo update
                          helm upgrade --install loki grafana/loki-stack \
                            --namespace elden-monitoring \
                            --values kubernetes/monitoring/loki/values.yaml \
                            --wait --timeout 10m
    - stage:
        name: Deploy Service Mesh and Security
        identifier: deploy_mesh_security
        type: Deployment
        spec:
          deploymentType: Kubernetes
          service:
            serviceRef: eldentargetapp
          environment:
            environmentRef: eldenproduction
            deployToAll: false
            infrastructureDefinitions:
              - identifier: elden_prod_infra
          execution:
            steps:
              - step:
                  name: Install Istio
                  identifier: install_istio
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          istioctl install -f kubernetes/service-mesh/istio/istio-operator.yaml -y
                          kubectl apply -f kubernetes/service-mesh/istio/gateway.yaml
              - step:
                  name: Install Falco
                  identifier: install_falco
                  type: ShellScript
                  timeout: 10m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          helm repo add falcosecurity https://falcosecurity.github.io/charts
                          helm repo update
                          helm upgrade --install falco falcosecurity/falco \
                            --namespace elden-monitoring \
                            --values kubernetes/security/falco/values.yaml \
                            --wait --timeout 10m
    - stage:
        name: Verify Infrastructure
        identifier: verify_infra
        type: Custom
        spec:
          execution:
            steps:
              - step:
                  name: Verify All Namespaces
                  identifier: verify_ns
                  type: ShellScript
                  timeout: 5m
                  spec:
                    shell: Bash
                    onDelegate: true
                    source:
                      type: Inline
                      spec:
                        script: |
                          echo "=== Verifying ELDEN RING Infrastructure ==="
                          NAMESPACES="elden-production elden-staging elden-canary elden-secure-coding elden-governance elden-monitoring elden-harness"
                          for ns in $NAMESPACES; do
                            if kubectl get namespace $ns > /dev/null 2>&1; then
                              echo "[OK] Namespace $ns exists"
                            else
                              echo "[FAIL] Namespace $ns not found"
                              exit 1
                            fi
                          done
                          echo ""
                          echo "=== Pod Status ==="
                          kubectl get pods -A -l app.kubernetes.io/part-of=elden-ring
                          echo ""
                          echo "=== Resource Quotas ==="
                          for ns in $NAMESPACES; do
                            echo "--- $ns ---"
                            kubectl get resourcequota -n $ns 2>/dev/null || echo "  No quota"
                          done
                          echo ""
                          echo "=== Infrastructure verification complete ==="
