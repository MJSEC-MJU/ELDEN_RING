# Harness Service - 보호 대상 서비스 (팀원들이 위에 Plane 올릴 때 이 서비스를 대상으로 함)
service:
  name: elden-target-app
  identifier: eldentargetapp
  tags:
    plane: runtime-defense
  serviceDefinition:
    type: Kubernetes
    spec:
      manifests:
        - manifest:
            identifier: k8s_manifests
            type: K8sManifest
            spec:
              store:
                type: Github
                spec:
                  connectorRef: eldenringgit
                  gitFetchType: Branch
                  paths:
                    - kubernetes/environments/production
                  branch: main
      artifacts:
        primary:
          primaryArtifactRef: <+input>
          sources:
            - spec:
                connectorRef: eldenringdocker
                imagePath: eldenring/target-app
                tag: <+input>
              identifier: target_app_image
              type: DockerRegistry
      variables:
        - name: PORT
          type: String
          value: "8080"
        - name: LOG_LEVEL
          type: String
          value: "info"
