apiVersion: v1
kind: ServiceAccount
metadata:
  name: pipeline-monitor-sa
  namespace: elden-monitoring
  labels:
    app: pipeline-monitor
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pipeline-monitor
  namespace: elden-monitoring
  labels:
    app: pipeline-monitor
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pipeline-monitor
  template:
    metadata:
      labels:
        app: pipeline-monitor
    spec:
      serviceAccountName: pipeline-monitor-sa
      containers:
        - name: monitor
          image: ghcr.io/mjsec-mju/elden-pipeline-monitor:dev-latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - { name: MONITOR_REDIS_URL, value: "redis://redis-master.elden-monitoring:6379/0" }
            - { name: MONITOR_GOVERNANCE_URL, value: "http://governance-controller.elden-governance:8080" }
            - { name: LOG_LEVEL, value: "INFO" }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits:   { cpu: 300m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: pipeline-monitor
  namespace: elden-monitoring
  labels:
    app: pipeline-monitor
spec:
  selector:
    app: pipeline-monitor
  ports:
    - port: 80
      targetPort: 8080
      name: http
