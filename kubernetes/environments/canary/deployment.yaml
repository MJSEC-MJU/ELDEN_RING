# ============================================================
# ELDEN RING - Canary Deployment (Governance 단계적 승격용)
# 검증 통과 후 트래픽 10% -> 50% -> 100% 점진 승격
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app-canary
  namespace: elden-canary
  labels:
    app: target-app
    version: canary
    elden-ring/plane: governance
spec:
  replicas: 1
  selector:
    matchLabels:
      app: target-app
      version: canary
  template:
    metadata:
      labels:
        app: target-app
        version: canary
        elden-ring/plane: governance
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: governance-sa
      containers:
        - name: target-app
          image: eldenring/target-app:canary
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: "canary"
            - name: LOG_LEVEL
              value: "info"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: elden-canary
  labels:
    app: target-app
spec:
  selector:
    app: target-app
    version: canary
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
