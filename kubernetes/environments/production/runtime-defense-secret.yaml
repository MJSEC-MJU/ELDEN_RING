# ============================================================
# ELDEN RING - Runtime Defense Secrets
#
# 웹훅 이벤트 주입 엔드포인트(/api/v1/modsec-events,
# /api/v1/falco-events, /api/v1/events/manual)에 사용되는 Bearer 토큰.
#
# 이 파일에 커밋된 토큰은 dev/kind 클러스터용 placeholder 입니다.
# 프로덕션 배포 전 반드시 회전하세요:
#
#   kubectl create secret generic runtime-defense-secrets \
#     --namespace=elden-production \
#     --from-literal=webhook-auth-token="$(openssl rand -hex 32)" \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# 토큰 회전 후 동기화 대상:
#   - kubernetes/security/falco/values.yaml (falcosidekick.config.webhook.customheaders)
#   - ModSecurity 로그 시퍼(추후 추가 예정)의 헤더 설정
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: runtime-defense-secrets
  namespace: elden-production
  labels:
    app: runtime-defense-controller
    elden-ring/plane: runtime-defense
type: Opaque
stringData:
  webhook-auth-token: "elden-ring-dev-CHANGE_ME_IN_PROD"
