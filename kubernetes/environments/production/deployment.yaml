# ============================================================
# ELDEN RING - target-app (Intentionally Vulnerable Flask App)
# Contains 3 deliberate vulnerabilities: SQLi, XSS, Path Traversal
# ModSecurity WAF blocks attacks at Ingress level before they reach this app
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: elden-production
  labels:
    app: target-app
    elden-ring/plane: target
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-app
  template:
    metadata:
      labels:
        app: target-app
        elden-ring/plane: target
      annotations:
        sidecar.istio.io/inject: "true"
    spec:
      containers:
        - name: target-app
          image: eldenring/target-app:latest
          ports:
            - containerPort: 5000
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          env:
            - name: DB_PATH
              value: "/app/data/users.db"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: elden-production
  labels:
    app: target-app
spec:
  selector:
    app: target-app
  ports:
    - port: 5000
      targetPort: 5000
      name: http
  type: ClusterIP
