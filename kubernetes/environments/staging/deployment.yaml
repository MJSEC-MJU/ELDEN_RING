# ============================================================
# ELDEN RING - Staging Deployment (Recovery Assurance 검증용)
# 패치 후보를 이 환경에 배포 후 3단계 검증 수행
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: target-app
  namespace: elden-staging
  labels:
    app: target-app
    version: staging
    elden-ring/plane: recovery-assurance
spec:
  replicas: 2
  selector:
    matchLabels:
      app: target-app
      version: staging
  template:
    metadata:
      labels:
        app: target-app
        version: staging
        elden-ring/plane: recovery-assurance
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
    spec:
      serviceAccountName: recovery-assurance-sa
      containers:
        - name: target-app
          image: ghcr.io/mjsec-mju/elden-target-app:dev-latest
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: APP_ENV
              value: "staging"
            - name: LOG_LEVEL
              value: "debug"
            - name: LOG_FORMAT
              value: "json"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: app-config
              mountPath: /etc/app
              readOnly: true
      volumes:
        - name: app-config
          configMap:
            name: target-app-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: target-app-config
  namespace: elden-staging
data:
  config.yaml: |
    server:
      port: 8080
      readTimeout: 30s
      writeTimeout: 30s
    database:
      host: db-service
      port: 5432
      maxConnections: 20
    security:
      rateLimitPerSecond: 100
      maxRequestBodySize: 1048576
---
apiVersion: v1
kind: Service
metadata:
  name: target-app
  namespace: elden-staging
  labels:
    app: target-app
spec:
  selector:
    app: target-app
  ports:
    - port: 8080
      targetPort: 8080
      name: http
  type: ClusterIP
