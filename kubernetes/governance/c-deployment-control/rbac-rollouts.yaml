# ============================================================
# C. Deployment Control — governance-sa permissions for Rollouts
# Promotion/rollback gate calls patch on Rollout resource.
# ============================================================
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elden-governance-rollouts-role
  labels:
    elden-ring/layer: c-deployment-control
rules:
  - apiGroups: ["argoproj.io"]
    resources: ["rollouts", "rollouts/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["argoproj.io"]
    resources: ["analysisruns", "analysistemplates", "experiments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elden-governance-rollouts-binding
  labels:
    elden-ring/layer: c-deployment-control
subjects:
  - kind: ServiceAccount
    name: governance-sa
    namespace: elden-governance
roleRef:
  kind: ClusterRole
  name: elden-governance-rollouts-role
  apiGroup: rbac.authorization.k8s.io
