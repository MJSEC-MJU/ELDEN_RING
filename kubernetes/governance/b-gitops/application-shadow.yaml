# ============================================================
# B. GitOps — Shadow (canary) app, auto-sync on dev branch
# Merged defense-candidate PRs land here first.
# ============================================================
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: elden-shadow
  namespace: argocd
  labels:
    elden-ring/layer: b-gitops
    elden-ring/stage: shadow
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: elden
  source:
    repoURL: https://github.com/MJSEC-MJU/ELDEN_RING.git
    targetRevision: dev
    path: kubernetes/environments/canary
  destination:
    server: https://kubernetes.default.svc
    namespace: elden-canary
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 5m
  revisionHistoryLimit: 20
