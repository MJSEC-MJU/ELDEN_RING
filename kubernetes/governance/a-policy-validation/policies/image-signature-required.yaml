# ============================================================
# A. Policy Validation — only allow signed images from approved registries
# Phase 2가 생성한 candidate 이미지는 cosign 서명되어 있어야 한다.
# ============================================================
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: elden-image-signature-required
  labels:
    elden-ring/layer: a-policy-validation
    elden-ring/risk: high
  annotations:
    policies.kyverno.io/title: Verify image signature
    policies.kyverno.io/category: elden-governance
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false
  webhookTimeoutSeconds: 30
  rules:
    - name: restrict-registries
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["elden-canary", "elden-production"]
      validate:
        message: "승인된 레지스트리(docker.io/eldenring, ghcr.io/mjsec-mju)의 이미지만 허용"
        pattern:
          spec:
            containers:
              - image: "docker.io/eldenring/* | ghcr.io/mjsec-mju/*"
    - name: verify-cosign-signature
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: ["elden-canary", "elden-production"]
      verifyImages:
        - imageReferences:
            - "docker.io/eldenring/*"
            - "ghcr.io/mjsec-mju/*"
          mutateDigest: true
          required: true
          verifyDigest: true
          attestors:
            - entries:
                - keyless:
                    subject: "https://github.com/MJSEC-MJU/ELDEN_RING/.github/workflows/*"
                    issuer: "https://token.actions.githubusercontent.com"
