# ============================================================
# ELDEN RING - RBAC Configuration
# Plane-level isolation with least-privilege access
# ============================================================

# --- Runtime Defense Plane RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: runtime-defense-sa
  namespace: elden-production
  labels:
    elden-ring/plane: runtime-defense
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: runtime-defense-role
  namespace: elden-production
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies", "peerauthentications"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  # /diagnostics surfaces current/desired HPA replica counts so the
  # reliability watcher can correlate load with autoscaling behavior.
  # Read-only on the controller's own HPA in this namespace.
  - apiGroups: ["autoscaling"]
    resources: ["horizontalpodautoscalers"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: runtime-defense-binding
  namespace: elden-production
subjects:
  - kind: ServiceAccount
    name: runtime-defense-sa
    namespace: elden-production
roleRef:
  kind: Role
  name: runtime-defense-role
  apiGroup: rbac.authorization.k8s.io

---
# --- Secure Coding Plane RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secure-coding-sa
  namespace: elden-secure-coding
  labels:
    elden-ring/plane: secure-coding
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secure-coding-role
  namespace: elden-secure-coding
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps", "secrets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secure-coding-binding
  namespace: elden-secure-coding
subjects:
  - kind: ServiceAccount
    name: secure-coding-sa
    namespace: elden-secure-coding
roleRef:
  kind: Role
  name: secure-coding-role
  apiGroup: rbac.authorization.k8s.io

---
# --- Recovery Assurance Plane RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: recovery-assurance-sa
  namespace: elden-staging
  labels:
    elden-ring/plane: recovery-assurance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: recovery-assurance-role
  namespace: elden-staging
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "endpoints"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "create", "update", "delete"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: recovery-assurance-binding
  namespace: elden-staging
subjects:
  - kind: ServiceAccount
    name: recovery-assurance-sa
    namespace: elden-staging
roleRef:
  kind: Role
  name: recovery-assurance-role
  apiGroup: rbac.authorization.k8s.io

---
# --- Canary Plane RBAC (Governance가 Canary NS에서 Pod 실행) ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-sa
  namespace: elden-canary
  labels:
    elden-ring/plane: governance

---
# --- Governance Plane RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: governance-sa
  namespace: elden-governance
  labels:
    elden-ring/plane: governance
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: elden-governance-role
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: [""]
    resources: ["services", "configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "destinationrules"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: elden-governance-binding
subjects:
  - kind: ServiceAccount
    name: governance-sa
    namespace: elden-governance
  - kind: ServiceAccount
    name: governance-sa
    namespace: elden-canary
roleRef:
  kind: ClusterRole
  name: elden-governance-role
  apiGroup: rbac.authorization.k8s.io

---
# --- Harness Delegate RBAC ---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: harness-delegate-sa
  namespace: elden-harness
  labels:
    elden-ring/plane: system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: harness-delegate-role
rules:
  - apiGroups: ["", "apps", "batch", "networking.k8s.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io", "security.istio.io"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: harness-delegate-binding
subjects:
  - kind: ServiceAccount
    name: harness-delegate-sa
    namespace: elden-harness
roleRef:
  kind: ClusterRole
  name: harness-delegate-role
  apiGroup: rbac.authorization.k8s.io
