# ============================================================
# ELDEN RING - Resource Quotas & Limit Ranges
# Plane별 리소스 제한으로 안정성 확보
# ============================================================

# --- Production (Runtime Defense Plane) ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: elden-production
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: elden-production
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      type: Container

---
# --- Staging (Recovery Assurance Plane) ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: elden-staging
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    limits.cpu: "8"
    limits.memory: 16Gi
    pods: "30"
    services: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: elden-staging
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
