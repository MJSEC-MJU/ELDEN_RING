---
# --- Secure Coding Plane ---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: secure-coding-quota
  namespace: elden-secure-coding
spec:
  hard:
    requests.cpu: "2"
    requests.memory: 4Gi
    limits.cpu: "4"
    limits.memory: 8Gi
    pods: "15"
    jobs.batch: "10"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: secure-coding-limits
  namespace: elden-secure-coding
spec:
  limits:
    - default:
        cpu: 1000m
        memory: 1Gi
      defaultRequest:
        cpu: 200m
        memory: 256Mi
      type: Container

---
# --- Governance Plane ---
apiVersion: v1
