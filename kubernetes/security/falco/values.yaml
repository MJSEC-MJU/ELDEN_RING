# ============================================================
# ELDEN RING - Falco Helm Values
# 런타임 보안 모니터링 - Runtime Defense Plane 핵심 도구
# 컨테이너 이상 행위 실시간 탐지
# ============================================================
falco:
  jsonOutput: true
  jsonIncludeOutputProperty: true
  httpOutput:
    enabled: true
    url: "http://falco-sidekick.elden-monitoring:2801"

  rules:
    # ELDEN RING 전용 탐지 규칙
    - macro: elden_ring_namespace
      condition: k8s.ns.name startswith "elden-"

    # 1. 프로덕션 네임스페이스에서 Shell 실행 탐지
    - rule: ELDEN Shell Spawned in Production
      desc: Detect shell execution in elden-production namespace
      condition: >
        spawned_process and
        container and
        k8s.ns.name = "elden-production" and
        (proc.name in (bash, sh, zsh, dash, ksh))
      output: >
        Shell spawned in production
        (user=%user.name container=%container.name
        namespace=%k8s.ns.name pod=%k8s.pod.name
        command=%proc.cmdline)
      priority: CRITICAL
      tags: [runtime-defense, shell]

    # 2. 의심스러운 네트워크 연결 탐지
    - rule: ELDEN Unexpected Outbound Connection
      desc: Detect unexpected outbound connections from production pods
      condition: >
        outbound and
        container and
        elden_ring_namespace and
        not (fd.sport in (53, 80, 443, 8080, 9090, 15090))
      output: >
        Unexpected outbound connection
        (namespace=%k8s.ns.name pod=%k8s.pod.name
        connection=%fd.name port=%fd.sport)
      priority: WARNING
      tags: [runtime-defense, network]

    # 3. 파일 시스템 변조 탐지
    - rule: ELDEN Filesystem Modification in Production
      desc: Detect unauthorized file modifications in production containers
      condition: >
        open_write and
        container and
        k8s.ns.name = "elden-production" and
        not (fd.name startswith /tmp or
             fd.name startswith /var/log or
             fd.name startswith /proc)
      output: >
        File modified in production container
        (file=%fd.name namespace=%k8s.ns.name
        pod=%k8s.pod.name command=%proc.cmdline)
      priority: ERROR
      tags: [runtime-defense, filesystem]

    # 4. 권한 상승 시도 탐지
    - rule: ELDEN Privilege Escalation Attempt
      desc: Detect privilege escalation in ELDEN RING namespaces
      condition: >
        spawned_process and
        container and
        elden_ring_namespace and
        (proc.name in (sudo, su, setuid) or
         proc.cmdline contains "chmod +s" or
         proc.cmdline contains "chown root")
      output: >
        Privilege escalation attempt
        (namespace=%k8s.ns.name pod=%k8s.pod.name
        user=%user.name command=%proc.cmdline)
      priority: CRITICAL
      tags: [runtime-defense, privilege-escalation]

    # 5. SQL Injection 패턴 탐지 (로그 기반)
    - rule: ELDEN SQL Injection Pattern
      desc: Detect SQL injection patterns in process arguments
      condition: >
        spawned_process and
        container and
        elden_ring_namespace and
        (proc.cmdline contains "UNION SELECT" or
         proc.cmdline contains "OR 1=1" or
         proc.cmdline contains "DROP TABLE" or
         proc.cmdline contains "'; --")
      output: >
        SQL injection pattern detected
        (namespace=%k8s.ns.name pod=%k8s.pod.name
        command=%proc.cmdline)
      priority: CRITICAL
      tags: [runtime-defense, sqli]

# Falco Sidekick: 이벤트를 외부로 전달
falcosidekick:
  enabled: true
  replicaCount: 1
  config:
    webhook:
      # Runtime Defense Plane 컨트롤러에 이벤트 전달
      # NOTE: 이 서비스는 Phase 1 담당자(이주오)가 배포할 때 생성됨
      #       서비스가 없으면 webhook 전달은 실패하지만 Falco 자체 동작에는 영향 없음
      address: "http://runtime-defense-controller.elden-production:8080/api/v1/falco-events"
    prometheus:
      extralabels: "plane:runtime-defense,system:elden-ring"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
