# ============================================================
# ELDEN RING - Dev Branch CI (GitHub Actions)
# dev에 머지되면: 빌드 + 테스트 + 이미지 푸시
# (개발자 코드 변경에 대한 CI만 담당)
# ============================================================
name: Dev CI

on:
  push:
    branches: [dev]

env:
  IMAGE_NAME: eldenring/target-app

jobs:
  build-and-push:
    name: Build & Push Dev Image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and Push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
            ${{ env.IMAGE_NAME }}:dev-latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:dev-${{ github.sha }}
          severity: HIGH,CRITICAL
          exit-code: 1

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Set kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config

      - name: Deploy to Staging
        run: |
          kubectl set image deployment/target-app \
            target-app=${{ env.IMAGE_NAME }}:dev-${{ github.sha }} \
            -n elden-staging
          kubectl rollout status deployment/target-app \
            -n elden-staging --timeout=300s
