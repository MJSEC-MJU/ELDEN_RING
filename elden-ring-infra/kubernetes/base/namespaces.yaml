# ============================================================
# ELDEN RING - Kubernetes Namespace Definitions
# 4 Plane Architecture + System Namespaces
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: elden-production
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: runtime-defense
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-staging
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: recovery-assurance
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-canary
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: governance
    istio-injection: enabled
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-secure-coding
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: secure-coding
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-governance
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: governance
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-monitoring
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: system
---
apiVersion: v1
kind: Namespace
metadata:
  name: elden-harness
  labels:
    app.kubernetes.io/part-of: elden-ring
    elden-ring/plane: system
