# ============================================================
# ELDEN RING - Prometheus + Grafana Helm Values
# kube-prometheus-stack 커스텀 설정
# ============================================================
namespaceOverride: elden-monitoring

prometheus:
  prometheusSpec:
    retention: 15d
    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 2Gi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi
    # ELDEN RING 네임스페이스만 모니터링
    serviceMonitorNamespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: elden-ring
    podMonitorNamespaceSelector:
      matchLabels:
        app.kubernetes.io/part-of: elden-ring
    # Istio 메트릭 스크래핑
    additionalScrapeConfigs:
      - job_name: "istio-mesh"
        kubernetes_sd_configs:
          - role: endpoints
            namespaces:
              names:
                - istio-system
        relabel_configs:
          - source_labels: [__meta_kubernetes_service_name, __meta_kubernetes_endpoint_port_name]
            action: keep
            regex: istio-telemetry;prometheus

grafana:
  enabled: true
  # Grafana admin 비밀번호는 K8s Secret으로 관리
  # 설치 전 아래 명령으로 Secret 생성 필요:
  #   kubectl create secret generic grafana-admin -n elden-monitoring --from-literal=admin-password=<YOUR_PASSWORD>
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  persistence:
    enabled: true
    size: 5Gi
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "elden-ring"
          orgId: 1
          folder: "ELDEN RING"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/elden-ring
  dashboards:
    elden-ring:
      # Runtime Defense Plane 대시보드
      runtime-defense:
        json: |
          {
            "dashboard": {
              "title": "ELDEN RING - Runtime Defense",
              "panels": [
                {
                  "title": "Request Rate by Namespace",
                  "type": "graph",
                  "targets": [
                    {
                      "expr": "sum(rate(istio_requests_total{reporter='destination',destination_service_namespace=~'elden-.*'}[5m])) by (destination_service_namespace)"
                    }
                  ]
                },
                {
                  "title": "Error Rate (5xx)",
                  "type": "stat",
                  "targets": [
                    {
                      "expr": "sum(rate(istio_requests_total{reporter='destination',response_code=~'5..',destination_service_namespace='elden-production'}[5m])) / sum(rate(istio_requests_total{reporter='destination',destination_service_namespace='elden-production'}[5m])) * 100"
                    }
                  ]
                },
                {
                  "title": "P99 Latency",
                  "type": "gauge",
                  "targets": [
                    {
                      "expr": "histogram_quantile(0.99, sum(rate(istio_request_duration_milliseconds_bucket{reporter='destination',destination_service_namespace='elden-production'}[5m])) by (le))"
                    }
                  ]
                },
                {
                  "title": "Falco Alerts",
                  "type": "table",
                  "targets": [
                    {
                      "expr": "sum by (rule) (falco_events_total{namespace=~'elden-.*'})"
                    }
                  ]
                }
              ]
            }
          }

alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 256Mi

# ELDEN RING 전용 알림 규칙
additionalPrometheusRulesMap:
  elden-ring-alerts:
    groups:
      - name: elden-ring.runtime-defense
        rules:
          - alert: HighErrorRate
            expr: |
              sum(rate(istio_requests_total{reporter="destination",response_code=~"5..",destination_service_namespace="elden-production"}[5m]))
              /
              sum(rate(istio_requests_total{reporter="destination",destination_service_namespace="elden-production"}[5m]))
              > 0.05
            for: 2m
            labels:
              severity: critical
              plane: runtime-defense
            annotations:
              summary: "Production error rate exceeds 5%"
              description: "Trigger Runtime Defense Plane response"

          - alert: HighLatency
            expr: |
              histogram_quantile(0.99,
                sum(rate(istio_request_duration_milliseconds_bucket{reporter="destination",destination_service_namespace="elden-production"}[5m])) by (le)
              ) > 1000
            for: 5m
            labels:
              severity: warning
              plane: runtime-defense
            annotations:
              summary: "P99 latency exceeds 1s in production"

          - alert: FalcoSecurityAlert
            expr: increase(falco_events_total{priority=~"Critical|Error",namespace=~"elden-.*"}[5m]) > 0
            for: 1m
            labels:
              severity: critical
              plane: runtime-defense
            annotations:
              summary: "Falco detected security event in ELDEN RING namespace"

      - name: elden-ring.recovery-assurance
        rules:
          - alert: StagingDeploymentFailed
            expr: kube_deployment_status_replicas_unavailable{namespace="elden-staging"} > 0
            for: 5m
            labels:
              severity: warning
              plane: recovery-assurance
            annotations:
              summary: "Staging deployment has unavailable replicas"
