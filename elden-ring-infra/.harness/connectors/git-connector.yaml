# Harness Git Connector
# GitOps용 소스 저장소 연결
connector:
  name: elden-ring-git
  identifier: eldenringgit
  type: Github
  spec:
    url: https://github.com/ELDEN-RING/elden-ring-infra
    authentication:
      type: Http
      spec:
        type: UsernameToken
        spec:
          username: REPLACE_WITH_GITHUB_USERNAME
          tokenRef: account.githubtoken
    apiAccess:
      type: Token
      spec:
        tokenRef: account.githubtoken
    delegateSelectors:
      - elden-ring
    executeOnDelegate: true
