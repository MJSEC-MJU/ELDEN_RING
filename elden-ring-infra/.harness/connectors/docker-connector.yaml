# Harness Docker Registry Connector
connector:
  name: elden-ring-docker
  identifier: eldenringdocker
  type: DockerRegistry
  spec:
    dockerRegistryUrl: https://index.docker.io/v2/
    providerType: DockerHub
    auth:
      type: UsernamePassword
      spec:
        username: REPLACE_WITH_DOCKER_USERNAME
        passwordRef: account.dockertoken
    delegateSelectors:
      - elden-ring
